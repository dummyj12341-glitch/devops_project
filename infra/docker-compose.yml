# DevSecOps platform: Jenkins + SonarQube (+ Postgres).
# Every container joins the "kind" network created by the kind cluster, so
# Jenkins and OWASP ZAP can reach the cluster API and the app NodePorts.
# Start everything with scripts/up.ps1 (it creates the cluster first).
name: devsecops

services:
  jenkins:
    build: ./jenkins
    image: devsecops-jenkins:latest
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      DEVSECOPS_REPO: ${DEVSECOPS_REPO:-https://github.com/dummyj12341-glitch/devops_project.git}
      DEVSECOPS_BRANCH: ${DEVSECOPS_BRANCH:-main}
      KUBECONFIG: /run/kube/config
      KIND_CLUSTER: devsecops
    volumes:
      - jenkins_home:/var/jenkins_home
      # lets pipeline steps build images and run scanner containers (local demo only)
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.secrets/kubeconfig:/run/kube/config:ro
    depends_on:
      - sonarqube

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      # Elasticsearch bootstrap checks need vm.max_map_count tuning; skipped for the local demo
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db

  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data

networks:
  default:
    name: kind
    external: true

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db:
