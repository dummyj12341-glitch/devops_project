# Deployment for the VULNERABLE app. Deliberately weak so Trivy's Kubernetes
# checks have something to report: privileged root container, no resource
# limits, writable root filesystem, service account token mounted.
# __IMAGE__ and __NODEPORT__ are filled in by the Jenkins pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-app
  labels: {app: devsecops-app}
spec:
  replicas: 1
  selector:
    matchLabels: {app: devsecops-app}
  template:
    metadata:
      labels: {app: devsecops-app}
    spec:
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-app
spec:
  type: NodePort
  selector: {app: devsecops-app}
  ports:
    - port: 80
      targetPort: 5000
      nodePort: __NODEPORT__
