# Single-node kind cluster "devsecops". NodePorts are published on localhost:
#   30080 -> staging, 30081 -> production
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devsecops
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
      - containerPort: 30081
        hostPort: 30081
