# Deployment for the SECURE app: non-root, read-only root filesystem, all
# capabilities dropped, seccomp, resource limits, no service account token.
# __IMAGE__ and __NODEPORT__ are filled in by the Jenkins pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-app
  labels: {app: devsecops-app}
spec:
  replicas: 2
  selector:
    matchLabels: {app: devsecops-app}
  template:
    metadata:
      labels: {app: devsecops-app}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-app
spec:
  type: NodePort
  selector: {app: devsecops-app}
  ports:
    - port: 80
      targetPort: 5000
      nodePort: __NODEPORT__
