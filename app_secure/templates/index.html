<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DevSecOps Demo App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; color: #fff;
             background: {{ '#c0392b' if variant == 'VULNERABLE' else '#27ae60' }}; }
    code { background: #f2f2f2; padding: 1px 4px; }
  </style>
</head>
<body>
  <h1>DevSecOps Demo App <span class="badge">{{ variant }}</span></h1>
  <p>Endpoints used by the pipeline:</p>
  <ul>
    <li><code>/health</code> &ndash; health check</li>
    <li><code>/user?name=alice</code> &ndash; user lookup</li>
    <li><code>/greet?name=guest</code> &ndash; greeting</li>
    <li><code>/hash?pw=secret</code> &ndash; password hash</li>
    <li><code>/ping?host=127.0.0.1</code> &ndash; connectivity check</li>
  </ul>
</body>
</html>
